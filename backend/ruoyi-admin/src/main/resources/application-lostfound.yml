# Lost-Found isolated integration environment.
# Keep the original ry-vue profile unchanged.
server:
  port: 8081

lostfound:
  expiry:
    enabled: true
    cron: 0 0/10 * * * ?
  security:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1

spring:
  datasource:
    druid:
      statViewServlet:
        enabled: false
      filter:
        wall:
          config:
            multi-statement-allow: false
      master:
        url: jdbc:mysql://localhost:3306/ry-vue-lostfound?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
